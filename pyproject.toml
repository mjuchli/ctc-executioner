[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ctc-executioner"
version = "0.0.1"
description = "Order placement with Reinforcement Learning for crypto currency markets"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "diskcache>=5.6.0",
    "pandas>=2.0.0",
    "seaborn>=0.13.0",
    "matplotlib>=3.7.0",
    "gymnasium>=1.0.0",
    "python-dateutil>=2.8.0",
    "scikit-learn>=1.3.0",
    "tensorflow>=2.15.0",
    "keras>=3.0.0",
    "h5py>=3.10.0",
    "stable-baselines3>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["gym_ctc_executioner*", "gym_ctc_marketmaker*", "ctc_executioner*"]
